[package]
name = "rusty-mqtt"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1.5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio-util = { version = "0.7", features = ["codec"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
